<!DOCTYPE html><html><head><meta charset="utf-8"><title>Live Draw &amp; Paint</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f1ece2;--fg:#3b3631;--btn1:#c4553b;--btn2:#e39a3f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1b19;--fg:#ddd5c8}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);box-sizing:border-box}
#wrap{position:relative;line-height:0;width:min(100%,calc(78vh*900/876));aspect-ratio:900/876}
canvas{width:100%;height:auto;box-shadow:0 10px 36px rgba(0,0,0,.3);background:#f6f0e2}
#tool{position:absolute;font-size:30px;pointer-events:none;display:none;transform:translate(-8%,-88%) rotate(-12deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#bar{height:3px;width:0;background:linear-gradient(90deg,var(--btn1),var(--btn2));align-self:flex-start}
button{font:600 17px Georgia,serif;color:#fff;border:0;border-radius:40px;padding:13px 34px;cursor:pointer;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 6px 18px rgba(196,85,59,.4)}
button:disabled{opacity:.6;cursor:default}
#msg{font-size:14px;opacity:.75;min-height:18px}
</style></head><body>

for(let c=0;c<3;c++){for(let i=0;i<N;i++)a[i]=src[i*4+c];blur(a,r,2);for(let i=0;i<N;i++)o[i*4+c]=a[i]}return o}
function prep1(){L.a=level(9);L.b=level(4);L.c=level(2);L.d=level(1);
const g=new Float32Array(N);for(let i=0;i<N;i++)g[i]=.3*src[i*4]+.59*src[i*4+1]+.11*src[i*4+2];
L.g=g;L.gb=blur(g.slice(),1,2);L.lb=new Float32Array(N);for(let i=0;i<N;i++)L.lb[i]=.3*L.b[i*4]+.59*L.b[i*4+1]+.11*L.b[i*4+2];

function prep2(){const gb=L.gb,g=L.g;
for(let y=2;y<H-2;y+=2)for(let x=2;x<W-2;x+=2){const i=y*W+x;
const gx=gb[i-W+1]+2*gb[i+1]+gb[i+W+1]-gb[i-W-1]-2*gb[i-1]-gb[i+W-1];
const gy=gb[i+W-1]+2*gb[i+W]+gb[i+W+1]-gb[i-W-1]-2*gb[i-W]-gb[i-W+1];
const m=Math.hypot(gx,gy);
if(m>55&&rnd()<.6){const a=Math.atan2(gy,gx)+Math.PI/2+(rnd()-.5)*.2,l=(9+rnd()*16)/2;
pencil.push({x1:x-Math.cos(a)*l,y1:y-Math.sin(a)*l,x2:x+Math.cos(a)*l,y2:y+Math.sin(a)*l,a:cl((m-40)/260,.2,.85),w:.8+rnd()*.7,e:1,k:Math.floor(y/48)*1e5+x+rnd()*60})}}

for(let y=4;y<H-4;y+=4)for(let x=4;x<W-4;x+=4){const i=y*W+x,v=g[i];
if(v<85&&rnd()<.8)hatch(x,y,-Math.PI/4,13,.42);else if(v<135&&rnd()<.45)hatch(x,y,Math.PI/4+.15,10,.26)}
function hatch(x,y,a,l,al){x+=rnd()*3;y+=rnd()*3;pencil.push({x1:x,y1:y,x2:x+Math.cos(a)*l,y2:y+Math.sin(a)*l,a:al,w:.9,e:0,k:Math.floor(y/48)*1e5+x+rnd()*60})}

function layer(r,sp,buf,thr,half,detail,cap){const list=[];

const px=Math.round(cl(x+(rnd()-.5)*sp*.8,6,W-7)),py=Math.round(cl(y+(rnd()-.5)*sp*.8,6,H-7)),i=(py*W+px)*4;
if(detail){const dd=Math.abs(src[i]-L.c[i])+Math.abs(src[i+1]-L.c[i+1])+Math.abs(src[i+2]-L.c[i+2]);if(dd<detail)continue}
const R=buf[i],G=buf[i+1],B=buf[i+2],q=py*W+px;
const gx=L.lb[q+3]-L.lb[q-3],gy=L.lb[q+3*W]-L.lb[q-3*W],m=Math.hypot(gx,gy);
const a=m>5?Math.atan2(gy,gx)+Math.PI/2:.9+.5*Math.sin(px/90)*Math.cos(py/110),dx=Math.cos(a),dy=Math.sin(a);
const ray=s=>{let t=0;while(t<half){const nx=Math.round(px+dx*(t+2)*s),ny=Math.round(py+dy*(t+2)*s);if(nx<0||ny<0||nx>=W||ny>=H)break;
const j=(ny*W+nx)*4;if(Math.abs(buf[j]-R)+Math.abs(buf[j+1]-G)+Math.abs(buf[j+2]-B)>thr)break;t+=2}return t};

const mx=px+dx*(t1-t2)/2,my=py+dy*(t1-t2)/2,len=t1+t2,bend=(rnd()-.5)*len*.18;
const o={x1:px-dx*t2,y1:py-dy*t2,x2:px+dx*t1,y2:py+dy*t1,cx:mx-dy*bend,cy:my+dx*bend,w:r*1.7,f:`rgb(${cr},${cg},${cb})`,r};
if(r>=10){o.lt=`rgb(${cl(cr+22)|0},${cl(cg+22)|0},${cl(cb+22)|0})`;o.dk=`rgb(${cl(cr-22)|0},${cl(cg-22)|0},${cl(cb-22)|0})`}
list.push(o)}
for(let i=list.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[list[i],list[j]]=[list[j],list[i]]}

let s=0;phases.forEach(p=>{p.s=s;s+=p.dur});phases.total=s;
ctx.putImageData(paper,0,0);msg.textContent='Ready — press the button';btn.disabled=false}
function path(o){ctx.beginPath();ctx.moveTo(o.x1,o.y1);if(o.cx!==undefined)ctx.quadraticCurveTo(o.cx,o.cy,o.x2,o.y2);else ctx.lineTo(o.x2,o.y2);ctx.stroke()}
function dPencil(o){ctx.globalCompositeOperation='source-over';ctx.lineCap='round';ctx.lineWidth=o.w;
ctx.strokeStyle=`rgba(45,40,50,${o.a})`;path(o);const j=(rnd()-.5)*.9,s={x1:o.x1+j,y1:o.y1-j,x2:o.x2+j,y2:o.y2-j};
ctx.strokeStyle=`rgba(45,40,50,${o.a*.55})`;path(s)}
function dInk(o){if(!o.e)return;ctx.globalCompositeOperation='multiply';ctx.lineCap='round';ctx.lineWidth=1.1;ctx.strokeStyle=`rgba(60,50,60,${o.a*.75})`;path(o);ctx.globalCompositeOperation='source-over'}
function dPaint(o){ctx.globalCompositeOperation='source-over';ctx.lineCap='round';ctx.globalAlpha=1;ctx.lineWidth=o.w;ctx.strokeStyle=o.f;path(o);
if(o.lt){const len=Math.hypot(o.x2-o.x1,o.y2-o.y1)||1,nx=-(o.y2-o.y1)/len,ny=(o.x2-o.x1)/len;ctx.globalAlpha=.32;ctx.lineWidth=o.w*.1;
for(let k=0;k<5;k++){const f=(k-2)*o.w*.2+(rnd()-.5)*o.w*.08;ctx.strokeStyle=k%2?o.lt:o.dk;
path({x1:o.x1+nx*f,y1:o.y1+ny*f,x2:o.x2+nx*f,y2:o.y2+ny*f,cx:o.cx+nx*f,cy:o.cy+ny*f})}ctx.globalAlpha=1}}
let t0=0,run=false;
function frame(now){if(!run)return;const el=now-t0;let last=null,cur=phases[0];
for(const p of phases){const fr=cl((el-p.s)/p.dur,0,1),tg=fr>=1?p.items.length:Math.floor(fr*p.items.length);p.d=p.d||0;
while(p.d<tg){last=p.items[p.d++];p.fn(last)}if(el>=p.s&&el<p.s+p.dur)cur=p}
if(last){tool.textContent=cur.ic;tool.style.left=(last.x2/W*100)+'%';tool.style.top=(last.y2/H*100)+'%'}
msg.textContent=cur.t;
if(el>=phases.total){run=false;tool.style.display='none';msg.textContent='Finished';btn.disabled=false;btn.textContent='Replay';return}
requestAnimationFrame(frame)}
btn.onclick=()=>{ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.putImageData(paper,0,0);phases.forEach(p=>p.d=0);
btn.disabled=true;btn.textContent='Painting…';tool.style.display='block';run=true;t0=performance.now();requestAnimationFrame(frame)};
</script></body></html>
